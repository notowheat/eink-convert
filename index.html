<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reTerminal 800x600 Card Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f0f2f5;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 860px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    textarea {
      width: 100%;
      height: 120px;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 13px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 18px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #0052a3; }
    .btn-secondary { background: #555; }
    .btn-secondary:hover { background: #333; }
    
    /* Viewport preview container: strict 800x600 */
    .preview-wrapper {
      overflow-x: auto;
      background: #ddd;
      padding: 12px;
      border-radius: 6px;
      display: flex;
      justify-content: center;
    }
    #render-target {
      width: 800px;
      min-width: 800px;
      height: 600px;
      min-height: 600px;
      background: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

<div class="container">
  <h2>reTerminal Recipe Formatter (800×600)</h2>

  <!-- Controls -->
  <div class="panel">
    <label><strong>Option A: Paste Custom HTML</strong></label>
    <textarea id="html-input" placeholder="Paste HTML & inline CSS here..."></textarea>
    
    <div class="btn-row">
      <button onclick="renderCustomHtml()">Preview HTML</button>
      <button class="btn-secondary" onclick="loadDefaultTemplate()">Load Default Recipe Template</button>
    </div>

    <hr style="margin: 16px 0; border: none; border-top: 1px solid #eee;">

    <label><strong>Option B: Upload Existing JPG/PNG (Fit to 800×600)</strong></label><br>
    <input type="file" id="image-upload" accept="image/*" style="margin-top: 8px;" onchange="handleImageUpload(event)">

    <div class="btn-row" style="margin-top: 16px;">
      <button style="background: #198754; font-size: 16px;" onclick="exportToJpg()">Download 800×600 JPG</button>
    </div>
  </div>

  <!-- 800x600 Viewport Box -->
  <div class="preview-wrapper">
    <div id="render-target"></div>
  </div>
</div>

<script>
  const target = document.getElementById('render-target');

  function renderCustomHtml() {
    const rawHtml = document.getElementById('html-input').value;
    if (!rawHtml.trim()) return;
    target.innerHTML = rawHtml;
  }

  function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      target.innerHTML = `
        <div style="width: 800px; height: 600px; display: flex; align-items: center; justify-content: center; background: #fff;">
          <img src="${evt.target.result}" style="max-width: 800px; max-height: 600px; object-fit: contain;">
        </div>
      `;
    };
    reader.readAsDataURL(file);
  }

  function loadDefaultTemplate() {
    const defaultTemplate = `
<div style="width: 800px; height: 600px; box-sizing: border-box; padding: 28px 36px; display: flex; flex-direction: column; justify-content: space-between; font-family: sans-serif; background: #fff; color: #111;">
  <div style="border-bottom: 3px solid #111; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline;">
    <h1 style="font-size: 26px; font-weight: 800; margin: 0; text-transform: uppercase;">Bánh Mì Prep Guide</h1>
    <span style="font-size: 13px; font-weight: 700; background: #111; color: #fff; padding: 3px 8px; border-radius: 4px;">RECIPE CARD</span>
  </div>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; height: calc(100% - 56px); margin-top: 14px;">
    <div style="border: 2px solid #222; border-radius: 8px; padding: 16px 20px; background: #fafafa; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="font-size: 18px; font-weight: 700; border-bottom: 2px solid #ddd; padding-bottom: 6px;">Lemongrass Marinade</div>
      <div style="font-size: 15px; line-height: 1.6;">
        <div>• <b>2 stalks</b> Lemongrass</div>
        <div>• <b>4 cloves</b> Garlic (minced)</div>
        <div>• <b>2 small</b> Shallots (or ¼ onion)</div>
        <div>• <b>2 tbsp</b> Fish Sauce</div>
        <div>• <b>1 tbsp</b> Soy Sauce (or Maggi)</div>
        <div>• <b>1 tbsp</b> Brown Sugar</div>
        <div>• <b>1 tbsp</b> Vegetable Oil</div>
        <div>• <b>½ tsp</b> Black Pepper</div>
        <div>• <b>1 tsp</b> Sesame Oil</div>
      </div>
    </div>
    <div style="border: 2px solid #222; border-radius: 8px; padding: 16px 20px; background: #fafafa; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="font-size: 18px; font-weight: 700; border-bottom: 2px solid #ddd; padding-bottom: 6px;">Pickled Veggies (Đồ Chua)</div>
      <div style="font-size: 15px; line-height: 1.6;">
        <div>• <b>1 cup</b> Water</div>
        <div>• <b>1 cup</b> White Vinegar</div>
        <div>• <b>½ cup</b> Granulated Sugar</div>
        <div>• <b>1 tbsp</b> Salt</div>
        <div>• <b>2 cups</b> Julienned Daikon</div>
        <div>• <b>2 cups</b> Julienned Carrot</div>
      </div>
    </div>
  </div>
</div>`;
    document.getElementById('html-input').value = defaultTemplate;
    target.innerHTML = defaultTemplate;
  }

  function exportToJpg() {
    html2canvas(target, {
      width: 800,
      height: 600,
      scale: 1, // keeps output native 1:1 at 800x600
      useCORS: true
    }).then(canvas => {
      const link = document.createElement('a');
      link.download = 'recipe_800x600.jpg';
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    });
  }

  // Auto-load template on page load
  loadDefaultTemplate();
</script>
</body>
</html>
